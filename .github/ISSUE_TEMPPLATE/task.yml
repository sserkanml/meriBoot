name: Task
description: A concrete, actionable unit of work belonging to an Epic
title: "[TASK] "
labels: ["task"]
body:
  - type: input
    id: epic
    attributes:
      label: Parent Epic
      description: Which epic does this belong to?
      placeholder: "#issue-number or epic title"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, specifically?
      placeholder: e.g. "Implement A20 enable via keyboard controller (ports 0x64/0x60)."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this task is done?
      placeholder: |
        - A20 line verified enabled via wrap-around test
        - Falls back to next method if this one fails
    validations:
      required: true

  - type: textarea
    id: spec-reference
    attributes:
      label: Multiboot2 Spec Reference
      description: Relevant spec section, if applicable
      placeholder: "e.g. section 3.3"

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - "Phase 1 - BIOS/Legacy Boot"
        - "Phase 2 - UEFI Boot"
    validations:
      required: true