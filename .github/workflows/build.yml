name: Build meriBoot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install build chain
        run: |
          chmod +x tools/setup_toolchain.sh
          ./tools/setup_toolchain.sh

      - name: Build meriBoot
        run: make 

      - name: Upload build image
        uses: actions/upload-artifact@v4
        with:
          name: meriBoot-image
          path: build/*.img
          if-no-files-found: warn